<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-version" content="1.6" />
    <title>課程模組導覽系統與資源索引</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      /* =========================================================================
   補強課程模組｜共用樣式表 v1
   ========================================================================= */

      :root {
        --paper: #f5f5f3;
        --card: #ffffff;
        --ink: #16181c;
        --ink2: #d35454;
        --ink-soft: #5b6470;
        --line: #dde1e4;
        --line-strong: #c3c9ce;

        --accent: #e2993d;
        --accent-soft: #fbedd6;
        --accent-ink: #8a5c19;
        --link: #1155cc;
        --link-soft: #dce6fa;

        --red: #d64545;
        --red-soft: #f7dede;
        --blue: #3b5fcb;
        --blue-soft: #dee4f7;
        --green: #3fa562;
        --green-soft: #ddf0e2;
        --slate: #5b6470;
        --slate-soft: #e3e5e7;

        --green-ink: #237244;
        --red-ink: #a11f1f;
        --blue-ink: #2f4fb0;

        --font-serif: "Noto Serif TC", "Songti TC", serif;
        --font-sans: "Noto Sans TC", system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "Consolas", monospace;

        --radius: 4px;
        --radius-lg: 8px;
        --radius-pill: 999px;

        --shadow: 0 1px 2px rgba(22, 24, 28, 0.04);
        --shadow-lift: 0 6px 18px rgba(22, 24, 28, 0.1);
        --shadow-modal: 0 20px 50px rgba(22, 24, 28, 0.25);

        --wrap: 1120px;
        --fs-scale: 1;
        /* 全域基準，恆為 1；卡片與彈窗另由 --card-scale 控制 */
        --card-scale: 1;
        /* 卡片／彈窗內文字級倍率 */

        --hit: #f6d9a0;
        /* 檢索命中標示底色 */
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: calc(14px * var(--fs-scale));
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: var(--wrap);
        width: 100%;
        margin: 0 auto;
        padding: 26px 20px 60px;
      }

      a {
        color: var(--link);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .hidden {
        display: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .skip-link {
        position: absolute;
        left: 8px;
        top: -48px;
        z-index: 1100;
        background: var(--ink);
        color: #fff;
        padding: 8px 14px;
        border-radius: var(--radius);
        text-decoration: none;
        transition: top 0.15s;
      }

      .skip-link:focus {
        top: 8px;
      }

      header {
        margin-bottom: 18px;
      }

      .eyebrow {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 0 0 6px;
      }

      h1 {
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: clamp(20px, 3.2vw, 28px);
        letter-spacing: 0.01em;
        margin: 0 0 6px;
      }

      .sub {
        margin: 0;
        /* max-width: 66ch; */
        font-size: 13.5px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      footer {
        margin-top: 30px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font-family: var(--font-mono);
        font-size: 11.5px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 16px 0 4px;
      }

      .tab {
        font-family: var(--font-serif);
        font-weight: 500;
        font-size: 13px;
        padding: 8px 14px 7px;
        background: var(--card);
        color: var(--ink-soft);
        border: 1px solid var(--line);
        border-bottom: 3px solid var(--line);
        border-radius: var(--radius) var(--radius) 0 0;
        cursor: pointer;
      }

      .tab:hover {
        color: var(--ink);
      }

      .tab.active {
        background: #fff;
        color: var(--ink);
        border-bottom-color: var(--accent);
      }

      .chip-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 10px 0 4px;
      }

      .chip-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.03em;
        padding: 6px 12px;
        background: #fff;
        color: var(--ink-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        cursor: pointer;
      }

      .chip-btn:hover {
        border-color: var(--ink-soft);
      }

      .chip-btn.active {
        background: var(--ink2);
        color: #fff;
        border-color: var(--ink2);
      }

      .chip-dot {
        width: 7px;
        height: 7px;
        border-radius: var(--radius-pill);
        flex-shrink: 0;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-end;
        margin: 18px 0 4px;
        padding: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field label {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .toolbar select,
      .toolbar input[type="search"],
      .toolbar input[type="text"] {
        font-family: var(--font-sans);
        font-size: 13.5px;
        padding: 7px 9px;
        min-width: 120px;
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .toolbar input[type="search"],
      .toolbar input[type="text"] {
        min-width: 220px;
      }

      .toolbar select:focus,
      .toolbar input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .toolbar .spacer {
        flex: 1;
        min-width: 0;
      }

      .search-scope {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-soft);
        cursor: pointer;
      }

      .search-scope input {
        width: auto;
        min-width: auto;
      }

      .layout-toggle {
        display: flex;
        height: fit-content;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .layout-toggle button {
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.05em;
        padding: 8px 12px;
        background: #fff;
        color: var(--ink-soft);
        border: none;
        cursor: pointer;
      }

      .layout-toggle button + button {
        border-left: 1px solid var(--line);
      }

      .layout-toggle button:not(.active):hover {
        background: var(--paper);
      }

      .layout-toggle button.active {
        background: var(--ink2);
        color: #fff;
      }

      .count-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 2px 14px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--ink-soft);
      }

      .count-line b {
        color: var(--ink);
        font-weight: 700;
      }

      .note {
        color: var(--ink-soft);
      }

      .note b {
        color: var(--accent-ink);
        font-weight: 700;
      }

      .results {
        display: grid;
        gap: 12px;
      }

      .results.grid-mode {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }

      .results.list-mode {
        grid-template-columns: 1fr;
      }

      .card {
        /* 只在卡片內改寫 --fs-scale：CSS 變數沿 DOM 繼承，
           底下所有 calc(px * var(--fs-scale)) 的字級一併縮放，
           而頁首、工具列、頁尾仍讀 :root 的 1，版面不會被放大撐破。 */
        --fs-scale: var(--card-scale);
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 16px 14px 18px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transition:
          border-color 0.18s,
          box-shadow 0.18s,
          transform 0.18s;
      }

      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 10px;
        bottom: 10px;
        width: 3px;
        background: var(--tagcolor, var(--accent));
        border-radius: 0 2px 2px 0;
      }

      .card.clickable {
        cursor: pointer;
      }

      .card.clickable:hover {
        border-color: var(--line-strong);
        box-shadow: var(--shadow-lift);
        transform: translateY(-2px);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .card-file {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-soft);
        white-space: nowrap;
      }

      .card-title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }

      .card-title-link {
        flex: 1;
        color: inherit;
        text-decoration: none;
      }

      .card-title {
        margin: 0;
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: calc(14.5px * var(--fs-scale));
        line-height: 1.45;
      }

      .card-title-link:hover .card-title {
        color: var(--accent);
      }

      .card-desc {
        margin: 0;
        font-size: calc(12.5px * var(--fs-scale));
        line-height: 1.75;
        color: var(--ink-soft);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.03em;
        padding: 3px 8px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
        background: var(--slate-soft);
        color: var(--slate);
      }

      .tag.subject {
        background: var(--link-soft);
        color: var(--link);
      }

      .tag.grade {
        background: var(--blue-soft);
        color: var(--blue-ink);
      }

      .tag.hidden-flag {
        background: var(--red-soft);
        color: var(--red-ink);
      }

      /* ?showhidden=1 覆核模式：未上架卡片以虛線框＋降透明度區隔 */
      .card.is-hidden {
        border-style: dashed;
        opacity: 0.66;
      }

      .card.is-hidden:hover {
        opacity: 1;
      }

      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .kwtag {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.02em;
        padding: 2px 7px;
        border-radius: var(--radius-pill);
        background: var(--paper);
        color: var(--ink-soft);
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: 2px;
      }

      .mini-btn {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.02em;
        padding: 4px 9px;
        background: #fff;
        color: var(--ink-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        cursor: pointer;
      }

      .mini-btn:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .mini-btn.open {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }

      .pdf-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
        padding: 4px 11px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.02em;
        background: var(--accent-soft);
        color: var(--accent-ink);
        border: 1px solid var(--accent);
        border-radius: var(--radius-pill);
        text-decoration: none;
        white-space: nowrap;
      }

      .pdf-link::before {
        content: "↗";
        font-size: 11px;
        line-height: 1;
      }

      .pdf-link:hover {
        background: var(--accent);
        color: #fff;
      }

      .panel {
        display: none;
        margin-top: 6px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
        font-size: calc(12.5px * var(--fs-scale));
        line-height: 1.75;
        color: var(--ink-soft);
      }

      .panel.open {
        display: block;
      }

      .panel h4 {
        margin: 10px 0 4px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .panel h4:first-child {
        margin-top: 0;
      }

      .panel ul {
        margin: 0 0 4px;
        padding-left: 16px;
      }

      .panel li {
        margin-bottom: 2px;
      }

      .match-snippet {
        margin-top: 4px;
        padding: 8px 10px;
        background: var(--accent-soft);
        border-radius: var(--radius);
        font-size: calc(12px * var(--fs-scale));
        line-height: 1.6;
        color: var(--ink);
      }

      .match-snippet b {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: 0.03em;
        color: var(--accent-ink);
      }

      mark {
        background: var(--hit);
        color: var(--ink);
        padding: 0 1px;
        border-radius: 2px;
      }

      .empty {
        grid-column: 1 / -1;
        padding: 40px 20px;
        text-align: center;
        font-size: 13.5px;
        color: var(--ink-soft);
        border: 1px dashed var(--line);
        border-radius: var(--radius);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(22, 24, 28, 0.55);
      }

      .modal-overlay.hidden {
        display: none;
      }

      .modal-box {
        --fs-scale: var(--card-scale);
        /* 同 .card，彈窗內文一併跟隨字級切換 */
        position: relative;
        width: 100%;
        max-width: 680px;
        max-height: 85vh;
        overflow-y: auto;
        padding: 30px 34px;
        background: var(--card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-modal);
      }

      .modal-close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        font-size: 1rem;
        line-height: 1;
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        cursor: pointer;
      }

      .modal-close:hover {
        background: var(--paper);
        border-color: var(--ink-soft);
      }

      .modal-header-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
        padding-right: 44px;
      }

      .modal-title {
        margin: 0 0 16px;
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: calc(20px * var(--fs-scale));
        line-height: 1.55;
      }

      .modal-body {
        font-size: calc(15px * var(--fs-scale));
        line-height: 2;
        color: var(--ink);
      }

      /* 新增按鈕樣式 (可放置於 .layout-toggle 樣式附近) */
      .font-toggle {
        display: flex;
        height: fit-content;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .font-toggle button {
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.05em;
        padding: 8px 12px;
        background: #fff;
        color: var(--ink-soft);
        border: none;
        cursor: pointer;
      }

      .font-toggle button + button {
        border-left: 1px solid var(--line);
      }

      .font-toggle button:not(.active):hover {
        background: var(--paper);
      }

      .font-toggle button.active {
        background: var(--ink2);
        color: #fff;
      }

      @media (max-width: 900px) {
        .results.grid-mode {
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }
      }

      @media (max-width: 640px) {
        .wrap {
          padding: 20px 14px 40px;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .toolbar select,
        .toolbar input[type="search"],
        .toolbar input[type="text"],
        .field {
          min-width: 0;
          width: 100%;
        }

        .toolbar .spacer {
          display: none;
        }

        .layout-toggle {
          width: 100%;
        }

        .layout-toggle button {
          flex: 1;
        }

        .tab {
          padding: 7px 11px 6px;
          font-size: 12px;
        }

        .chip-btn {
          padding: 5px 10px;
          font-size: 11px;
        }

        .results.grid-mode {
          grid-template-columns: 1fr;
        }

        .modal-overlay {
          align-items: flex-start;
          padding: 12px;
        }

        .modal-box {
          max-width: 100%;
          max-height: 92vh;
          margin-top: 16px;
          padding: 22px 18px;
        }

        .modal-title {
          font-size: calc(17px * var(--fs-scale));
        }

        .modal-body {
          font-size: calc(14px * var(--fs-scale));
          line-height: 1.9;
        }

        .modal-close {
          top: 12px;
          right: 12px;
          width: 30px;
          height: 30px;
        }

        .ctl-label {
          display: none;
        }
      }

      @media (max-width: 380px) {
        .card {
          padding: 12px 14px 12px 16px;
        }

        .card-title {
          font-size: calc(13.5px * var(--fs-scale));
        }

        .tag,
        .kwtag {
          font-size: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }

        .card.clickable:hover {
          transform: none;
        }

        .ctl-label {
          display: none;
        }
      }

      .ctl-label {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-weight: 500;
        min-width: 44px;
        line-height: 26px;
      }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main">跳到主要內容</a>
    <main class="wrap" id="main">
      <header>
        <p class="eyebrow">補強課程模組 · 課程導覽與資源索引</p>
        <h1>課程模組導覽系統</h1>
        <p class="sub">依領域、年級與關鍵字篩選課程模組。點卡片可展開完整說明，點「課程指標」可查看指標，或勾選「同時搜尋 PDF 內文」做全文檢索。</p>
      </header>

      <!-- 年級／系列篩選 -->
      <div class="tabs" id="tabs"></div>

      <!-- 領域篩選 -->
      <div class="chip-bar" id="domainFilterBar"></div>

      <!-- 關鍵字搜尋 / 檢視切換 -->
      <div class="toolbar">
        <div class="field">
          <label for="f-search">關鍵字／標題搜尋</label>
          <input type="search" id="f-search" placeholder="例如：畢氏定理、Phonics…" />
        </div>
        <label class="search-scope">
          <input type="checkbox" id="f-fulltext" />
          同時搜尋 PDF 內文
        </label>
        <div class="spacer"></div>

        <!-- 新增：字型大小切換按鈕 -->
        <span class="ctl-label" style="min-width: auto">字級</span>
        <div class="font-toggle">
          <button type="button" data-scale="0.9" aria-pressed="false">小</button>
          <button type="button" data-scale="1" class="active" aria-pressed="true">中</button>
          <button type="button" data-scale="1.15" aria-pressed="false">大</button>
        </div>
        <span class="ctl-label" style="min-width: auto">顯示方式</span>
        <div class="layout-toggle">
          <button type="button" id="btn-grid" aria-pressed="false">卡片</button>
          <button type="button" id="btn-list" class="active" aria-pressed="true">清單</button>
        </div>
      </div>

      <p class="count-line">
        <span id="count-text" aria-live="polite" aria-atomic="true"></span>
        <span class="note" id="hidden-note" style="display: none"></span>
      </p>

      <h2 id="results-heading" class="sr-only">檢索結果</h2>
      <div class="results list-mode" id="results" role="region" aria-labelledby="results-heading"></div>

      <footer>國立臺灣師範大學教育學系教育專業發展中心 · 國民中小學學習扶助教師增能諮詢輔導暨多元補強課程模組推動計畫</footer>
    </main>

    <!-- 閱讀彈出視窗 -->
    <div class="modal-overlay hidden" id="modalOverlay">
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
        <button class="modal-close" id="modalCloseBtn" aria-label="關閉">✕</button>
        <div class="modal-header-row">
          <span class="tag" id="modalId"></span>
          <a class="pdf-link" id="modalPdfLink" href="#" target="_blank" rel="noopener">
            開啟 PDF
            <span class="sr-only">（PDF，另開新視窗）</span>
          </a>
        </div>
        <h2 class="modal-title" id="modalTitle">模組詳細內容</h2>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <script>
      const FIREBASE_BUCKET = "upload-2a184.appspot.com";
      const DATA_FOLDER = "data";

      // data/ 的 JSON 由 upload_module.py 上傳，物件帶
      // Cache-Control: public, max-age=0, must-revalidate。瀏覽器每次載入
      // 都會發條件式請求，內容未變更時回 304 只傳標頭。
      //
      // 舊作法以 Date.now() 讓每個網址成為唯一值，等於繞過快取全量下載；
      // pages.json 是全文層資料，重複載入的成本集中在此。
      //
      // 退路：若 data/ 的 JSON 改回 Console 上傳（無法設定標頭，
      // 物件回 max-age=3600 且無 revalidate），將此常數設為 true。
      const NEED_CACHE_BUST = false;

      function fbUrl(filename) {
        const path = encodeURIComponent(`${DATA_FOLDER}/${filename}`);
        const url = `https://firebasestorage.googleapis.com/v0/b/${FIREBASE_BUCKET}/o/${path}?alt=media`;
        return NEED_CACHE_BUST ? `${url}&v=${Date.now()}` : url;
      }

      const URLS = {
        data: fbUrl("data.json"),
        indicators: fbUrl("indicators.json"),
        pages: fbUrl("pages.json"),
      };

      let DATA = [];
      let INDICATORS = {};
      let PAGES = null; // null = 尚未載入；{} = 載入失敗或空檔
      let PAGES_LOADING = false;

      // -----------------------------------------------------------------------
      // 前台上架控制
      //   資料端在 data.json 的模組物件加上 "hidden": true 即從前台移除。
      //   欄位不存在或為 false 皆視為上架，因此既有資料不必逐筆補欄位。
      //   欄位名以常數收斂，日後若要改名只需動這一行。
      // -----------------------------------------------------------------------
      const HIDE_FIELD = "hidden";
      const isHidden = (d) => d[HIDE_FIELD] === true;

      // 覆核模式：網址加 ?showhidden=1 時保留未上架模組，並加註記號。
      // 用於上架前確認內容，一般使用者不會觸發。
      const SHOW_HIDDEN = new URLSearchParams(location.search).get("showhidden") === "1";

      const IND_ORDER = ["學習內容", "學習表現", "基本學習內容"];
      const SUBJECT_COLOR = {
        英語文: "var(--red)",
        數學: "var(--blue)",
        國語文: "var(--green)",
        另類適性: "var(--slate)",
      };
      const GRADE_ORDER = ["全部", "七年級", "八年級", "九年級", "中小銜接"];
      const UNIVERSAL_GRADE = "國中通用";
      const UNIVERSAL_APPLIES_TO = ["七年級", "八年級", "九年級"];

      const DOMAIN_FILTERS = [
        { label: "全領域", value: "全部", color: null },
        { label: "國語文領域", value: "國語文", color: "var(--green)" },
        { label: "英語文領域", value: "英語文", color: "var(--red)" },
        { label: "數學領域", value: "數學", color: "var(--blue)" },
        { label: "另類適性模組", value: "另類適性", color: "var(--slate)" },
      ];

      const state = {
        grade: "全部",
        subject: "全部",
        q: "",
        layout: "list",
        fulltext: false,
      };
      const openIndicators = new Set();

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // -----------------------------------------------------------------------
      // 檢索正規化
      //   中文不斷詞，故一律「全形轉半形 → 去掉所有空白 → 轉小寫」後直接
      //   indexOf。同時產生位置對照表 map：map[i] 為正規化字串第 i 字在原文
      //   的索引，命中後可換算回原文區間，標示位置不會因刪去空白而偏移。
      // -----------------------------------------------------------------------
      function normalize(s) {
        const out = [],
          map = [];
        const str = String(s == null ? "" : s);
        for (let i = 0; i < str.length; i++) {
          let ch = str[i];
          const c = str.charCodeAt(i);
          if (c === 0x3000) continue; // 全形空白 U+3000
          if (c >= 0xff01 && c <= 0xff5e) ch = String.fromCharCode(c - 0xfee0);
          if (/\s/.test(ch)) continue; // 半形空白與換行
          out.push(ch.toLowerCase());
          map.push(i);
        }
        return { n: out.join(""), map };
      }

      // 只要正規化字串（建 haystack 用，不需位置）
      const norm = (s) => normalize(s).n;

      // -----------------------------------------------------------------------
      // 標示所有命中處，回傳已跳脫的 HTML。
      //   先切片再逐段 esc()，不對已跳脫字串跑 regex：否則關鍵字含 & < > 時，
      //   實體字串（&amp;）會被誤配或破壞，標示與跳脫互相打架。
      // -----------------------------------------------------------------------
      function mark(text, q) {
        const src = String(text == null ? "" : text);
        if (!q) return esc(src);
        const { n, map } = normalize(src);
        const nq = norm(q);
        if (!nq) return esc(src);

        const spans = [];
        let from = 0,
          idx;
        while ((idx = n.indexOf(nq, from)) !== -1) {
          spans.push([map[idx], map[idx + nq.length - 1] + 1]);
          from = idx + nq.length;
        }
        if (!spans.length) return esc(src);

        let html = "",
          cur = 0;
        for (const [a, b] of spans) {
          html += esc(src.slice(cur, a)) + "<mark>" + esc(src.slice(a, b)) + "</mark>";
          cur = b;
        }
        return html + esc(src.slice(cur));
      }

      // 後設欄位 haystack：結果快取在記錄物件的 _hay 上，只算一次。
      // 未加快取前，每次按鍵都要對全部記錄重建串接字串並正規化。
      function hayOf(d) {
        if (d._hay) return d._hay;
        d._hay = norm([d.title, (d.tags || []).join(" "), d.file, d.description || ""].join(" "));
        return d._hay;
      }

      // -----------------------------------------------------------------------
      // 連結自動切換（v1.4：探測與開啟分離）
      //   四層順序：學校空間短網址 → Firebase 短網址 → 學校空間直連 →
      //   Firebase 直連。每層的 open 是實際開啟的網址、probe 是拿來測連通性
      //   的網址，兩者刻意不同：短網址每被 fetch 一次 supr.link 就計一次點，
      //   若用短網址自身探測，一次點擊會計兩次。因此前兩層一律改探測對應的
      //   直連網址（tracked:false），開啟時才走短網址。
      //   後兩層是直連退路，open 與 probe 同一個網址，本來就不計點。
      // -----------------------------------------------------------------------
      const LINK_CHAIN = [
        { open: "school_html", probe: "school_direct" },
        { open: "firebase_pdf", probe: "firebase_direct" },
        { open: "school_direct", probe: "school_direct" },
        { open: "firebase_direct", probe: "firebase_direct" },
      ];

      // 以 label 定址而非索引，短網址未填時該層自然跳過，不會錯位。
      const linkOf = (links, label) => (links || []).find((l) => l.label === label && l.url) || null;

      const linkHealthCache = new Map(); // url -> boolean，同一網址同一 session 只探測一次

      // no-cors 讀不到 status，只能測出網路層失敗（DNS／逾時／離線），
      // 404 與 200 同樣算「通」。用 HEAD 是為了避免探測直連 PDF 時
      // 在背景把整份檔案拉下來。
      async function probeReachable(url, timeoutMs = 1500) {
        if (linkHealthCache.has(url)) return linkHealthCache.get(url);
        try {
          await fetch(url, {
            method: "HEAD",
            mode: "no-cors",
            signal: AbortSignal.timeout(timeoutMs),
          });
          linkHealthCache.set(url, true);
          return true;
        } catch (e) {
          linkHealthCache.set(url, false);
          return false;
        }
      }

      async function resolveLink(links) {
        for (const step of LINK_CHAIN) {
          const open = linkOf(links, step.open);
          const probe = linkOf(links, step.probe);
          if (!open || !probe) continue;
          // 安全閥：probe 一旦指到計點網址就跳過該層，寧可降級也不誤計。
          if (probe.tracked === true) continue;
          if (await probeReachable(probe.url)) return open.url;
        }
        return null; // 全部連不通
      }

      // 靜態 href 的預設值：取鏈上第一個存在的 open，讓右鍵複製、中鍵開新分頁
      // 在探測發生前就有正確目標。
      function primaryLink(links) {
        for (const step of LINK_CHAIN) {
          const open = linkOf(links, step.open);
          if (open) return open.url;
        }
        return "#";
      }

      // 事件委派：全站只掛一個 listener，連結節點本身不綁事件。
      //   卡片每次 render 重建節點，舊 listener 隨節點消失；但 modal 的
      //   #modalPdfLink 是常駐節點，逐次綁定會累積 listener，開 N 次 modal
      //   後點一次就觸發 N 輪探測與 N 個分頁。改委派後兩者都只有一份邏輯。
      function installLinkDelegation() {
        document.addEventListener("click", async (e) => {
          const a = e.target.closest("a[data-resolve]");
          if (!a) return;
          if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          const d = DATA.find((m) => String(m.id) === a.dataset.resolve);
          if (!d || !d.links) return; // 找不到資料就讓靜態 href 自己作用
          e.preventDefault();
          if (a.dataset.busy === "1") return; // 探測期間連點只算一次
          a.dataset.busy = "1";
          try {
            const url = await resolveLink(d.links);
            if (url) {
              window.open(url, "_blank", "noopener");
            } else {
              alert("目前所有連結來源（學校空間、Firebase、短網址服務）暫時都無法連線，請稍後再試。");
            }
          } finally {
            delete a.dataset.busy;
          }
        });
      }

      async function boot() {
        const results = document.getElementById("results");
        results.innerHTML = `<div class="empty">資料載入中…</div>`;
        try {
          // pages.json（PDF 全文層）不在此預載：多數使用者不會勾選內文檢索，
          // 預載等於每次進站都拉一份最大的檔案。改由 ensurePages() 按需取得。
          const [dataRes, indicatorsRes] = await Promise.all([fetch(URLS.data), fetch(URLS.indicators)]);
          if (!dataRes.ok || !indicatorsRes.ok) throw new Error("主要資料載入失敗");

          const raw = await dataRes.json();
          // 單一過濾點：在此濾除未上架模組後，下游的年級分頁、領域篩選、
          // 筆數計算、全文檢索與彈窗查找全部自動一致，毋須各自判斷。
          DATA = SHOW_HIDDEN ? raw : raw.filter((d) => !isHidden(d));
          const hiddenCount = raw.filter(isHidden).length;

          INDICATORS = await indicatorsRes.json();

          const note = document.getElementById("hidden-note");
          if (SHOW_HIDDEN) {
            note.style.display = "";
            note.innerHTML = `<b>覆核模式</b>：已一併列出 ${hiddenCount} 筆未上架模組（虛線框）。移除網址參數 <code>?showhidden=1</code> 即回到正式檢視。`;
          } else {
            note.style.display = "none";
            note.innerHTML = "";
          }

          setupControls();
          render();
        } catch (err) {
          results.innerHTML = `<div class="empty">資料載入失敗，請確認 Firebase 上的 JSON 檔案網址是否正確，或稍後重新整理頁面。<br><span style="font-family:'JetBrains Mono',monospace;font-size:11px;">${esc(String(err.message || err))}</span></div>`;
          document.getElementById("count-text").textContent = "共 0 / 0 筆資源";
        }
      }

      // -----------------------------------------------------------------------
      // 全文層延遲載入
      //   僅在「勾選內文檢索且已有關鍵字」時觸發。PAGES_LOADING 兼作重入鎖，
      //   避免 debounce 期間連續輸入重複發請求。失敗時把 PAGES 設為空物件而非
      //   留 null，否則每次輸入都會再打一次已知會失敗的請求。
      // -----------------------------------------------------------------------
      async function ensurePages() {
        if (PAGES || PAGES_LOADING) return;
        PAGES_LOADING = true;
        render(); // 讓筆數列即時顯示載入狀態
        try {
          const res = await fetch(URLS.pages);
          if (!res.ok) throw new Error("pages.json 回應 " + res.status);
          PAGES = await res.json();
        } catch (e) {
          console.error("pages.json 載入失敗", e);
          PAGES = {};
        } finally {
          PAGES_LOADING = false;
          render();
        }
      }

      function setupControls() {
        buildTabs();
        buildDomainFilters();
        setupFontToggle();
        // 140 ms debounce：逐字輸入時 render() 會對全部記錄重跑篩選與字串比對，
        // 不節流的話長字詞每多打一個字就多一輪全量重繪。
        const searchInput = document.getElementById("f-search");
        let searchTimer = null;
        searchInput.addEventListener("input", () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            state.q = searchInput.value.trim();
            if (state.fulltext && state.q) ensurePages();
            render();
          }, 140);
        });
        document.getElementById("f-fulltext").addEventListener("change", (e) => {
          state.fulltext = e.target.checked;
          if (state.fulltext && state.q) ensurePages();
          render();
        });
        document.getElementById("btn-grid").addEventListener("click", () => setLayout("grid"));
        document.getElementById("btn-list").addEventListener("click", () => setLayout("list"));
        // 以 state.layout 為唯一真值來源，啟動時同步按鈕與容器 class，
        // 避免靜態標記與 state 初值日後再度分歧。
        setLayout(state.layout);
      }

      function buildTabs() {
        const list = GRADE_ORDER.filter((g) => g === "全部" || DATA.some((d) => d.grade === g));
        const el = document.getElementById("tabs");
        el.innerHTML = list.map((g) => `<button type="button" class="tab ${g === state.grade ? "active" : ""}" data-grade="${g}" aria-pressed="${g === state.grade}">${g}</button>`).join("");
        el.querySelectorAll(".tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.grade = btn.dataset.grade;
            render();
          });
        });
      }

      function buildDomainFilters() {
        const el = document.getElementById("domainFilterBar");
        const present = new Set(DATA.map((d) => d.subject));
        const list = DOMAIN_FILTERS.filter((f) => f.value === "全部" || present.has(f.value));
        el.innerHTML = list
          .map(
            (f) => `
    <button type="button" class="chip-btn ${f.value === state.subject ? "active" : ""}" data-subject="${f.value}" aria-pressed="${f.value === state.subject}">
      ${f.color ? `<span class="chip-dot" style="background:${f.color};"></span>` : ""}${f.label}
    </button>
  `,
          )
          .join("");
        el.querySelectorAll(".chip-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.subject = btn.dataset.subject;
            el.querySelectorAll(".chip-btn").forEach((b) => {
              b.classList.remove("active");
              b.setAttribute("aria-pressed", "false");
            });
            btn.classList.add("active");
            btn.setAttribute("aria-pressed", "true");
            render();
          });
        });
      }
      // 新增設定字型按鈕的函式
      function setupFontToggle() {
        const fontBtns = document.querySelectorAll(".font-toggle button");
        fontBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            // 移除所有按鈕的 active 狀態；aria-pressed 與 class 必須同步，
            // 否則螢幕閱讀器讀到的選中項會與畫面不一致
            fontBtns.forEach((b) => {
              b.classList.remove("active");
              b.setAttribute("aria-pressed", "false");
            });
            // 將被點擊的按鈕設為 active
            // 綁定對象改用 btn 而非 e.target：按鈕內若日後加入圖示等子元素，
            // e.target 會指向該子元素，dataset.scale 將讀到 undefined
            btn.classList.add("active");
            btn.setAttribute("aria-pressed", "true");
            // 只改 --card-scale：實際套用發生在 .card / .modal-box 內部的
            // --fs-scale 覆寫，頁首、工具列、頁尾維持原字級不受影響。
            document.documentElement.style.setProperty("--card-scale", btn.dataset.scale);
          });
        });
      }
      function setLayout(mode) {
        state.layout = mode;
        document.getElementById("btn-grid").classList.toggle("active", mode === "grid");
        document.getElementById("btn-list").classList.toggle("active", mode === "list");
        document.getElementById("btn-grid").setAttribute("aria-pressed", mode === "grid");
        document.getElementById("btn-list").setAttribute("aria-pressed", mode === "list");
        const results = document.getElementById("results");
        results.classList.toggle("grid-mode", mode === "grid");
        results.classList.toggle("list-mode", mode === "list");
      }

      // 回傳首個命中頁的片段與總命中頁數；PAGES 尚未載入時回 null。
      // 比對走 normalize()，故全形英數、全形空白與斷行都不會漏失。
      function findPageMatch(file, q) {
        if (!PAGES) return null;
        const pages = PAGES[file];
        const nq = norm(q);
        if (!pages || !nq) return null;

        let first = null;
        let total = 0;
        for (const pg of pages) {
          const { n, map } = normalize(pg.t);
          const idx = n.indexOf(nq);
          if (idx === -1) continue;
          total++;
          if (first) continue; // 後續頁只計數，不再取片段
          const a = map[idx];
          const b = map[idx + nq.length - 1] + 1;
          const start = Math.max(0, a - 28);
          const end = Math.min(pg.t.length, b + 28);
          const rawSlice = pg.t.slice(start, end).replace(/\n+/g, " ");
          first = {
            page: pg.p,
            snippet: (start > 0 ? "…" : "") + mark(rawSlice, q) + (end < pg.t.length ? "…" : ""),
          };
        }
        return first ? { ...first, total } : null;
      }

      function cardHTML(d) {
        const inds = INDICATORS[d.file] || [];
        const grouped = IND_ORDER.map((cat) => ({
          cat,
          items: inds.filter((i) => i.c === cat),
        })).filter((g) => g.items.length > 0);
        const indicatorPanelId = `panel-${d.file.replace(".pdf", "")}`;
        const isOpen = openIndicators.has(d.file);
        const descText = d.description || "";
        const descPreview = descText.length > 80 ? descText.substring(0, 80) + "..." : descText;

        return `
  <div class="card clickable ${isHidden(d) ? "is-hidden" : ""}" data-id="${esc(d.id)}" style="--tagcolor:${SUBJECT_COLOR[d.subject] || "var(--accent)"}">
    <div class="card-top">
      <span class="card-file">${esc(d.file)}</span>
      <a class="pdf-link" href="${esc(primaryLink(d.links))}" data-resolve="${esc(d.id)}" target="_blank" rel="noopener">開啟 PDF<span class="sr-only">（PDF，另開新視窗）</span></a>
    </div>
    <div class="card-title-row">
      <a class="card-title-link" href="${esc(primaryLink(d.links))}" data-resolve="${esc(d.id)}" target="_blank" rel="noopener">
        <h3 class="card-title">${mark(d.title, state.q)}</h3>
      </a>
    </div>
    <div class="tags">
      <span class="tag subject">${esc(d.subject)}</span>
      <span class="tag grade">${esc(d.grade)}</span>
      ${isHidden(d) ? '<span class="tag hidden-flag">未上架</span>' : ""}
    </div>
    <div class="card-tags">
      ${d.tags
        .slice(0, 5)
        .map((t) => `<span class="kwtag">${esc(t)}</span>`)
        .join("")}
      ${d.tags.length > 5 ? `<span class="kwtag">+${d.tags.length - 5}</span>` : ""}
    </div>
    <p class="card-desc">${mark(descPreview, state.q)}</p>
    ${d.pageMatch ? `<div class="match-snippet"><b>第 ${d.pageMatch.page} 頁符合${d.pageMatch.total > 1 ? `（共 ${d.pageMatch.total} 頁）` : ""}：</b><br>${d.pageMatch.snippet}</div>` : ""}
    <div class="card-actions">
      <button type="button" class="mini-btn" data-open="${esc(d.id)}">詳細說明</button>
      ${grouped.length ? `<button type="button" class="mini-btn ${isOpen ? "open" : ""}" data-toggle="${esc(d.file)}" aria-expanded="${isOpen}" aria-controls="${indicatorPanelId}">課程指標（${inds.length}）<span aria-hidden="true">${isOpen ? "▲" : "▼"}</span></button>` : ""}
    </div>
    ${
      grouped.length
        ? `
      <div class="panel ${isOpen ? "open" : ""}" id="${indicatorPanelId}">
        ${grouped
          .map(
            (g) => `
          <h4>${g.cat}</h4>
          <ul>${g.items.map((i) => `<li>${esc(i.d)}</li>`).join("")}</ul>
        `,
          )
          .join("")}
      </div>
    `
        : ""
    }
  </div>`;
      }

      function render() {
        buildTabs();

        const nq = norm(state.q); // 每次 render 只正規化一次查詢字串
        const filtered = [];
        for (const d of DATA) {
          if (state.grade !== "全部") {
            const matchesGrade = d.grade === state.grade || (d.grade === UNIVERSAL_GRADE && UNIVERSAL_APPLIES_TO.includes(state.grade));
            if (!matchesGrade) continue;
          }
          if (state.subject !== "全部" && d.subject !== state.subject) continue;

          let pageMatch = null;
          if (nq) {
            const titleHit = hayOf(d).includes(nq);
            // 勾選「含內文」時一律查全文，不因後設欄位（標題／標籤／描述）已命中而短路。
            // 否則主題最相關的模組（例如搜「機率」時的 m0901）反而看不到內文佐證片段。
            if (state.fulltext) pageMatch = findPageMatch(d.file, state.q);
            // 後設欄位與內文任一命中即保留；篩選結果筆數與修改前一致，差別僅在片段是否顯示。
            if (!titleHit && !pageMatch) continue;
          }
          filtered.push({ ...d, pageMatch });
        }

        document.getElementById("count-text").textContent = `共 ${filtered.length} / ${DATA.length} 筆資源` + (PAGES_LOADING ? "　載入 PDF 內文中…" : "");

        const results = document.getElementById("results");
        if (filtered.length === 0) {
          results.innerHTML = `<div class="empty">找不到符合篩選條件的資源，試試調整科目、年級或關鍵字，或勾選「同時搜尋 PDF 內文」。</div>`;
          return;
        }

        // 連結不在此逐一綁定：click 由 installLinkDelegation() 的單一
        // 委派 handler 處理，靜態 href 已由 cardHTML 寫入 primaryLink。
        results.innerHTML = filtered.map(cardHTML).join("");
      }

      /* ---------- Modal 邏輯 ---------- */
      const modalOverlay = document.getElementById("modalOverlay");
      const modalId = document.getElementById("modalId");
      const modalTitle = document.getElementById("modalTitle");
      const modalBody = document.getElementById("modalBody");
      const modalPdfLink = document.getElementById("modalPdfLink");
      const modalCloseBtn = document.getElementById("modalCloseBtn");
      let lastTrigger = null;

      function openModal(id) {
        const d = DATA.find((m) => String(m.id) === String(id));
        if (!d) return;
        modalId.textContent = d.id;
        modalId.className = "tag subject";
        modalTitle.textContent = d.title;
        modalBody.textContent = d.description;
        modalPdfLink.href = primaryLink(d.links);
        modalPdfLink.dataset.resolve = String(d.id);
        lastTrigger = document.activeElement;
        modalOverlay.classList.remove("hidden");
        modalCloseBtn.focus();
      }

      function closeModal() {
        if (modalOverlay.classList.contains("hidden")) return;
        modalOverlay.classList.add("hidden");
        if (lastTrigger && typeof lastTrigger.focus === "function") lastTrigger.focus();
      }

      modalOverlay.addEventListener("keydown", (e) => {
        if (e.key !== "Tab") return;
        const f = modalOverlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        const first = f[0],
          last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      });

      modalCloseBtn.addEventListener("click", closeModal);
      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      document.getElementById("results").addEventListener("click", (e) => {
        if (e.target.closest("a")) return;

        const toggleBtn = e.target.closest("[data-toggle]");
        if (toggleBtn) {
          const file = toggleBtn.dataset.toggle;
          if (openIndicators.has(file)) openIndicators.delete(file);
          else openIndicators.add(file);
          render();
          return;
        }

        const openBtn = e.target.closest("[data-open]");
        if (openBtn) {
          openModal(openBtn.dataset.open);
          return;
        }

        const card = e.target.closest(".card");
        if (card) {
          openModal(card.dataset.id);
        }
      });

      installLinkDelegation();
      boot();
    </script>
  </body>
</html>
